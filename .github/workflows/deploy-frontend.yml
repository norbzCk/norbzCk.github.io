name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend-react/**"
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Build frontend
        working-directory: frontend-react
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_SUPABASE_URL: https://jjryzuwfzneyxtkkjejd.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_i3sqYYX9aT1ftZ98JuHXdg_Wr-jaNbE
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          publish_dir: ./frontend-react/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend-react/dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a custom domain
          # cname: your-domain.com
