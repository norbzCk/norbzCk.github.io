[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    auth: authentication and authorization tests
    products: product management tests
    sales: sales and order tests
    payments: payment processing tests
    logistics: delivery and logistics tests
    notifications: notification system tests
    dashboard: dashboard and analytics tests
    marketplace: marketplace intelligence tests
    ai_assistant: AI assistant tests
    order_runtime: order runtime and inventory tests
    notification_service: notification service tests
    disputes: dispute resolution tests
    customers: customer management tests
    rfq: request for quotation tests
    providers: provider management tests