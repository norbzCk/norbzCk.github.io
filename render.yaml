services:
  - type: web
    runtime: static
    name: sokolink-frontend
    rootDir: frontend-react
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: sales-backend
          property: url
      - key: VITE_SUPABASE_URL
        value: https://jjryzuwfzneyxtkkjejd.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_i3sqYYX9aT1ftZ98JuHXdg_Wr-jaNbE
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sales-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: false
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.jjryzuwfzneyxtkkjejd:Xk5ydMQ3oxAZoJpP@aws-0-eu-north-1.pooler.supabase.com:5432/postgres
      - key: SUPABASE_URL
        value: https://jjryzuwfzneyxtkkjejd.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://jjryzuwfzneyxtkkjejd.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_DATABASE_URL
        value: postgresql://postgres.jjryzuwfzneyxtkkjejd:Xk5ydMQ3oxAZoJpP@aws-0-eu-north-1.pooler.supabase.com:5432/postgres
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://norbzCk.github.io,https://sokolink-frontend.onrender.com,http://localhost:5173,http://localhost:3000"

databases:
  - name: sales-db
    databaseName: sales_db
    user: sales_user
